name: Auto Update Xoilac M3U Playlist

on:
  schedule:
    # Tự động chạy mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

# Cấp quyền cho GitHub Actions bot để push thay đổi vào repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Playwright
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium --with-deps

    - name: Run Scraper
      run: python generate_m3u.py

    - name: Commit and Push M3U File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add xoilac.m3u
        git diff-index --quiet HEAD || git commit -m "Auto-update Xoilac M3U playlist [skip ci]"
        git push
        
