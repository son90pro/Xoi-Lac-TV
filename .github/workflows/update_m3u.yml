name: Auto Update Xoilac M3U Playlist

on:
  schedule:
    # Tự động chạy mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper
      run: python generate_m3u.py

    - name: Commit and Push M3U File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add xoilac.m3u
        git diff-index --quiet HEAD || git commit -m "Auto-update Xoilac M3U playlist [skip ci]"
        git push

