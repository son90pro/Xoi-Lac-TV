name: Auto Update IPTV M3U Playlist

on:
  scheduled:
    - cron: '*/30 * * * *' # Chạy tự động mỗi 30 phút
  workflow_dispatch: # Cho phép chạy thủ công trên giao diện GitHub

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi cho GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run playlist generator script
        run: python generator.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Kiểm tra xem file playlist.m3u có tồn tại không trước khi add
          if [ -f "playlist.m3u" ]; then
            git add playlist.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U playlist [skip ci]" && git push)
          else
            echo "File playlist.m3u không được tạo thành công bởi script!"
            exit 1
          fi
          
