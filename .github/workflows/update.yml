name: Auto Update IPTV List

on:
  schedule:
    # Chạy tự động mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ giao diện GitHub

# Bắt buộc phân quyền ghi (write) để bot có thể push file xoilac.m3u lên repository
permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run M3U generator script
      run: python generate_m3u.py

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update playlist [skip ci]"
        file_pattern: "xoilac.m3u"
        
